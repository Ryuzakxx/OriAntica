<!DOCTYPE html>
<html lang="it">
<head>
  <script>
  (function() {
    var ALLOWED = ['light', 'dark'];
    try {
      var t = localStorage.getItem('oria-theme');
      if (ALLOWED.includes(t)) document.documentElement.dataset.theme = t;
    } catch(_) {}
  })();
  </script>
  <style id="theme-fix">html,body,nav,footer{transition:none!important}</style>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Torneo dei Rioni — OriAntica</title>
  <link rel="stylesheet" href="style.css"/>

</head>
