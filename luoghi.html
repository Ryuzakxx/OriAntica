<!DOCTYPE html>
<html lang="it">
<head>
  <script>
  (function() {
    var ALLOWED = ['light', 'dark'];
    try {
      var t = localStorage.getItem('oria-theme');
      if (ALLOWED.includes(t)) document.documentElement.dataset.theme = t;
    } catch(_) {}
  })();
  </script>
  <style id="theme-fix">
    html, body, nav, footer { transition: none !important; }
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luoghi Storici di Oria</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="luoghi">

  <nav>
    <div class="nav-wrap">
      <a class="nav-logo" href="index.html">
        <img src="./images/logo.png" alt="OriAntica">OriAntica
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-page="home">Home</a></li>
        <li><a href="leggende.html" data-page="leggende">Leggende</a></li>
        <li><a href="luoghi.html" data-page="luoghi">Luoghi</a></li>
        <li><a href="storia.html" data-page="storia">Storia</a></li>
        <li><a href="torneo.html" data-page="torneo">Torneo</a></li>
        <li><a href="corteo.html" data-page="corteo">Corteo</a></li>
        <li><a href="feedback.html" data-page="feedback">Contattaci</a></li>
        <li><button class="theme-btn" id="theme-btn">☾</button></li>
      </ul>
    </div>
  </nav>

  <div class="content">
    <div class="page-top">
      <span class="page-kicker">Architettura &middot; Archeologia &middot; Arte &middot; Storia</span>
      <h1>Luoghi Storici</h1>
      <p>Le pietre che custodiscono la memoria di Oria e del Salento</p>
    </div>

    <div class="sec">
      <span class="sec-label">Nel centro storico</span>
      <h2>Oria</h2>
      <div class="grid" id="luoghi-grid-centro"></div>
    </div>

    <div class="sec">
      <span class="sec-label">Entro 10 km</span>
      <h2>Nei dintorni</h2>
      <div class="grid" id="luoghi-grid-dintorni"></div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script>
    function luogoCard(item) {
      var thumb = item.img
        ? '<img src="' + item.img + '" alt="' + item.title + '" loading="lazy">'
        : '<span class="ph-icon">' + item.icon + '</span><span class="ph-txt">' + (item.imgAlt || '') + '</span>';
      return '<a class="card reveal" href="detail-luogo.html?id=' + item.id + '">'
        + '<div class="card-thumb">' + thumb + '</div>'
        + '<span class="card-kicker">' + item.tag + '</span>'
        + '<h3>' + item.title + '</h3>'
        + '<p>' + item.excerpt + '</p>'
        + '<div class="card-more">Scopri il luogo &rarr;</div>'
        + '</a>';
    }

    var gridCentro = document.getElementById('luoghi-grid-centro');
    var gridDintorni = document.getElementById('luoghi-grid-dintorni');

    if (typeof LUOGHI !== 'undefined') {
      if (gridCentro)   gridCentro.innerHTML   = LUOGHI.filter(function(x) { return x.zona === 'centro'; }).map(luogoCard).join('');
      if (gridDintorni) gridDintorni.innerHTML = LUOGHI.filter(function(x) { return x.zona === 'dintorni'; }).map(luogoCard).join('');
    }
  </script>
</body>
</html>
